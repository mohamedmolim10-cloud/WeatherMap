<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap - Asynchronous SPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Custom Application CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1 class="app-title">WeatherMap</h1>
    </header>

    <main class="main-container">
        
        <section class="search-section">
            <form id="weather-form" class="weather-form" novalidate>
                <label for="location-input" class="form-label">Location:</label>
                <div class="input-group">
                    <input type="text" id="location-input"  class="location-input" placeholder="Search for a location (e.g. Omdurman, Port Sudan)..." 
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="search-btn" class="search-btn">Get Weather</button>
                </div>
            </form>
        </section>

   
        <section class="feedback-section" aria-live="polite">
            <div id="loading-spinner" class="spinner-container hidden">
                <div class="spinner"></div>
                <p class="spinner-text">Retrieving meteorological coordinates...</p>
            </div>
            
            <div id="error-alert" class="alert-card hidden">
                <span class="alert-icon">⚠️</span>
                <span id="error-message" class="alert-text"></span>
            </div>
        </section>

        <section class="map-section">
            <div id="map-container" class="map-container"></div>
        </section>
    </main>

    <footer class="app-footer">
        <p>WeatherMap SPA &bull; Data from OpenStreetMap & OpenWeatherMap</p>
    </footer>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Application Logic (Vanilla JS) -->
    <script src="main.js"></script>
</body>
</html>
